<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JesPay</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{font-family:Arial;background:#0d0d26;color:#fff;margin:0}
.container{max-width:500px;margin:auto;padding:20px}
.card{background:#1a1a3d;padding:15px;border-radius:12px;margin-bottom:15px}
input,button{width:100%;padding:10px;margin-top:10px;border-radius:8px;border:none}
button{background:#7c5cff;color:white;font-weight:bold;cursor:pointer}
.list-item{background:#2a2a5a;padding:10px;border-radius:8px;margin-top:10px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:8px}
.small-btn{flex:1;background:#4CAF50}
.share-btn{flex:1;background:#25D366}
.pay-btn{flex:1;background:#ff9800}
.time{font-size:12px;color:#bbb}
canvas{margin-top:20px}
</style>
</head>
<body>
<div class="container"><h2>JesPay 💸</h2><div class="card">
<p><b>UPI:</b> jeswanthjeswanth53616@okaxis</p>
<button onclick="copyUPI()">Copy UPI</button>
</div><div class="card">
<h3>Summary</h3>
<p><b>Total You Spent:</b> ₹<span id="totalSpent">0</span></p>
<p><b>Total You Received:</b> ₹<span id="totalReceived">0</span></p>
<p>Total Owed: ₹<span id="owed">0</span></p>
<p>People Pending: <span id="people">0</span></p>
<p>Total Settled: ₹<span id="settled">0</span></p>
</div><div class="card">
<h3>Monthly Analytics</h3>
<canvas id="chart"></canvas>
</div><div class="card">
<h3>Add Person & Amount</h3>
<input id="name" placeholder="Name">
<input id="amount" type="number" placeholder="Amount">
<input id="note" placeholder="Note (Dinner, Travel...)">
<button onclick="addPerson()">Add to Split</button>
</div><div class="card">
<h3>Pending</h3>
<div id="pending"></div>
</div><div class="card">
<h3>Settled</h3>
<div id="settledList"></div>
</div></div><script>
let data = JSON.parse(localStorage.getItem("jespay_data")) || [];
let chart;

function save(){
    localStorage.setItem("jespay_data", JSON.stringify(data));
}

function copyUPI(){
    navigator.clipboard.writeText("jeswanthjeswanth53616@okaxis");
    alert("UPI Copied");
}

function getCurrentTime(){
    return new Date().toISOString();
}

function getMonthLabel(dateStr){
    let d = new Date(dateStr);
    return d.toLocaleString('default', { month: 'short' });
}

function addPerson(){
    let name = document.getElementById("name").value.trim();
    let amount = parseFloat(document.getElementById("amount").value);
    let note = document.getElementById("note").value.trim();

    if(name === "" || isNaN(amount)){
        alert("Enter valid details");
        return;
    }

    data.push({name, amount, note, paid:false, time:getCurrentTime()});
    save();
    render();

    document.getElementById("name").value="";
    document.getElementById("amount").value="";
    document.getElementById("note").value="";
}

function markPaid(index){
    data[index].paid = true;
    data[index].paidTime = getCurrentTime();
    save();
    render();
}

function generateUPILink(name, amount, note){
    let upi = "jeswanthjeswanth53616@okaxis";
    return `upi://pay?pa=${upi}&pn=${encodeURIComponent(name)}&am=${amount}&cu=INR&tn=${encodeURIComponent(note || 'Payment')}`;
}

function shareWhatsApp(index){
    let item = data[index];
    let upiLink = generateUPILink(item.name, item.amount, item.note);

    let message = `Hi ${item.name}, just a reminder 😊\nYou need to pay ₹${item.amount}\nFor: ${item.note || '-'}\n\nPay here👇\n${upiLink}`;

    window.open("https://wa.me/?text=" + encodeURIComponent(message), '_blank');
}

function payNow(index){
    window.location.href = generateUPILink(data[index].name, data[index].amount, data[index].note);
}

function updateChart(){
    let monthly = {};

    data.forEach(item => {
        let month = getMonthLabel(item.time);
        monthly[month] = (monthly[month] || 0) + item.amount;
    });

    let labels = Object.keys(monthly);
    let values = Object.values(monthly);

    if(chart) chart.destroy();

    chart = new Chart(document.getElementById("chart"), {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: 'Monthly Spending ₹',
                data: values
            }]
        }
    });
}

function render(){
    let pendingDiv = document.getElementById("pending");
    let settledDiv = document.getElementById("settledList");

    pendingDiv.innerHTML = "";
    settledDiv.innerHTML = "";

    let totalOwed = 0, totalSettled = 0, peoplePending = 0, totalSpent = 0, totalReceived = 0;

    data.forEach((item, index)=>{
        totalSpent += item.amount;
        if(item.paid) totalReceived += item.amount;

        if(item.paid){
            totalSettled += item.amount;
            settledDiv.innerHTML += `<div class="list-item">
                <div>${item.name} - ₹${item.amount}</div>
                <div class="time">Reason: ${item.note || '-'}</div>
                <div class="time">Paid on: ${new Date(item.paidTime).toLocaleString()}</div>
            </div>`;
        } else {
            totalOwed += item.amount;
            peoplePending++;
            pendingDiv.innerHTML += `<div class="list-item">
                <div>${item.name} - ₹${item.amount}</div>
                <div class="time">Reason: ${item.note || '-'}</div>
                <div class="time">Added: ${new Date(item.time).toLocaleString()}</div>
                <div class="row">
                    <button class="small-btn" onclick="markPaid(${index})">Paid</button>
                    <button class="share-btn" onclick="shareWhatsApp(${index})">Share</button>
                    <button class="pay-btn" onclick="payNow(${index})">Pay</button>
                </div>
            </div>`;
        }
    });

    document.getElementById("owed").innerText = totalOwed;
    document.getElementById("settled").innerText = totalSettled;
    document.getElementById("people").innerText = peoplePending;
    document.getElementById("totalSpent").innerText = totalSpent;
    document.getElementById("totalReceived").innerText = totalReceived;

    updateChart();
}

render();
</script></body>
</html>
