<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JesPay</title>
<style>
body{
    font-family: Arial;
    background:#0d0d26;
    color:#fff;
    margin:0;
}
.container{
    max-width:500px;
    margin:auto;
    padding:20px;
}
.card{
    background:#1a1a3d;
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
}
input,button{
    width:100%;
    padding:10px;
    margin-top:10px;
    border-radius:8px;
    border:none;
}
button{
    background:#7c5cff;
    color:white;
    font-weight:bold;
}
.list-item{
    background:#2a2a5a;
    padding:10px;
    border-radius:8px;
    margin-top:10px;
    display:flex;
    justify-content:space-between;
}
</style>
</head>
<body>
<div class="container"><h2>JesPay 💸</h2><div class="card">
<p><b>UPI:</b> jeswanthjeswanth53616@okaxis</p>
<button onclick="copyUPI()">Copy UPI</button>
</div><div class="card">
<h3>Summary</h3>
<p>Total Owed: ₹<span id="owed">0</span></p>
<p>People Pending: <span id="people">0</span></p>
<p>Total Settled: ₹<span id="settled">0</span></p>
</div><div class="card">
<h3>Add Person & Amount</h3>
<input id="name" placeholder="Name">
<input id="amount" type="number" placeholder="Amount">
<input id="note" placeholder="Note">
<button onclick="addPerson()">Add to Split</button>
</div><div class="card">
<h3>Pending</h3>
<div id="pending"></div>
</div><div class="card">
<h3>Settled</h3>
<div id="settledList"></div>
</div></div><script>
let data = [];

function copyUPI(){
    navigator.clipboard.writeText("jeswanthjeswanth53616@okaxis");
    alert("UPI Copied");
}

function addPerson(){
    let name = document.getElementById("name").value;
    let amount = parseFloat(document.getElementById("amount").value);
    let note = document.getElementById("note").value;

    if(name === "" || isNaN(amount)){
        alert("Enter valid details");
        return;
    }

    data.push({name, amount, note, paid:false});
    render();
}

function markPaid(index){
    data[index].paid = true;
    render();
}

function render(){
    let pendingDiv = document.getElementById("pending");
    let settledDiv = document.getElementById("settledList");

    pendingDiv.innerHTML = "";
    settledDiv.innerHTML = "";

    let totalOwed = 0;
    let totalSettled = 0;
    let peoplePending = 0;

    data.forEach((item, index)=>{
        if(item.paid){
            totalSettled += item.amount;
            settledDiv.innerHTML += `
            <div class="list-item">
                ${item.name} - ₹${item.amount}
            </div>`;
        } else {
            totalOwed += item.amount;
            peoplePending++;
            pendingDiv.innerHTML += `
            <div class="list-item">
                ${item.name} - ₹${item.amount}
                <button onclick="markPaid(${index})">Paid</button>
            </div>`;
        }
    });

    document.getElementById("owed").innerText = totalOwed;
    document.getElementById("settled").innerText = totalSettled;
    document.getElementById("people").innerText = peoplePending;
}
</script></body>
</html>
