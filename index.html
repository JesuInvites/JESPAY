<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JesPay</title>
<style>
body{font-family:Arial;background:#0d0d26;color:#fff;margin:0}
.container{max-width:500px;margin:auto;padding:20px}
.card{background:#1a1a3d;padding:15px;border-radius:12px;margin-bottom:15px}
input,button{width:100%;padding:10px;margin-top:10px;border-radius:8px;border:none}
button{background:#7c5cff;color:white;font-weight:bold;cursor:pointer}
.list-item{background:#2a2a5a;padding:10px;border-radius:8px;margin-top:10px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px}
.small-btn{flex:1;background:#4CAF50}
.share-btn{flex:1;background:#25D366}
.pay-btn{flex:1;background:#ff9800}
</style>
</head>
<body>
<div class="container"><h2>JesPay 💸</h2><div class="card">
<p><b>UPI:</b> jeswanthjeswanth53616@okaxis</p>
<button onclick="copyUPI()">Copy UPI</button>
</div><div class="card">
<h3>Summary</h3>
<p>Total Owed: ₹<span id="owed">0</span></p>
<p>People Pending: <span id="people">0</span></p>
<p>Total Settled: ₹<span id="settled">0</span></p>
</div><div class="card">
<h3>Add Person & Amount</h3>
<input id="name" placeholder="Name">
<input id="amount" type="number" placeholder="Amount">
<input id="note" placeholder="Note (Dinner, Travel...)">
<button onclick="addPerson()">Add to Split</button>
</div><div class="card">
<h3>Pending</h3>
<div id="pending"></div>
</div><div class="card">
<h3>Settled</h3>
<div id="settledList"></div>
</div></div><script>
let data = JSON.parse(localStorage.getItem("jespay_data")) || [];

function save(){
    localStorage.setItem("jespay_data", JSON.stringify(data));
}

function copyUPI(){
    navigator.clipboard.writeText("jeswanthjeswanth53616@okaxis");
    alert("UPI Copied");
}

function addPerson(){
    let name = document.getElementById("name").value.trim();
    let amount = parseFloat(document.getElementById("amount").value);
    let note = document.getElementById("note").value.trim();

    if(name === "" || isNaN(amount)){
        alert("Enter valid details");
        return;
    }

    data.push({name, amount, note, paid:false});
    save();
    render();

    document.getElementById("name").value="";
    document.getElementById("amount").value="";
    document.getElementById("note").value="";
}

function markPaid(index){
    data[index].paid = true;
    save();
    render();
}

// 🔥 UPI Deep Link Generator
function generateUPILink(name, amount, note){
    let upi = "jeswanthjeswanth53616@okaxis";
    let encodedNote = encodeURIComponent(note || "Payment");
    let encodedName = encodeURIComponent(name);
    return `upi://pay?pa=${upi}&pn=${encodedName}&am=${amount}&cu=INR&tn=${encodedNote}`;
}

function shareWhatsApp(index){
    let item = data[index];
    let noteText = item.note ? `\nFor: ${item.note}` : "";

    let upiLink = generateUPILink(item.name, item.amount, item.note);

    let message = `Hi ${item.name}, just a reminder 😊\nYou need to pay ₹${item.amount}${noteText}\n\nPay here👇\n${upiLink}`;

    let url = "https://wa.me/?text=" + encodeURIComponent(message);
    window.open(url, '_blank');
}

function payNow(index){
    let item = data[index];
    let upiLink = generateUPILink(item.name, item.amount, item.note);
    window.location.href = upiLink;
}

function render(){
    let pendingDiv = document.getElementById("pending");
    let settledDiv = document.getElementById("settledList");

    pendingDiv.innerHTML = "";
    settledDiv.innerHTML = "";

    let totalOwed = 0;
    let totalSettled = 0;
    let peoplePending = 0;

    data.forEach((item, index)=>{
        if(item.paid){
            totalSettled += item.amount;
            settledDiv.innerHTML += `
            <div class="list-item">
                <div>${item.name} - ₹${item.amount}</div>
            </div>`;
        } else {
            totalOwed += item.amount;
            peoplePending++;
            pendingDiv.innerHTML += `
            <div class="list-item">
                <div>${item.name} - ₹${item.amount}</div>
                <div class="row">
                    <button class="small-btn" onclick="markPaid(${index})">Paid</button>
                    <button class="share-btn" onclick="shareWhatsApp(${index})">Share</button>
                    <button class="pay-btn" onclick="payNow(${index})">Pay</button>
                </div>
            </div>`;
        }
    });

    document.getElementById("owed").innerText = totalOwed;
    document.getElementById("settled").innerText = totalSettled;
    document.getElementById("people").innerText = peoplePending;
}

render();
</script></body>
</html>
